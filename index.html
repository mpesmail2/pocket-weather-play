// Portable startup: GitHub Pages serves .pck.gz as a file, without custom headers.
window.pwCache = [];
window.pwMarks = {};
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', event => {
        if (event.data.type === 'pw-cache') window.pwCache.push(event.data);
    });
}
window.pwMark = function (name) {
    window.pwMarks[name] = performance.now();
    const report = {
        marks: window.pwMarks, cache: window.pwCache,
        resources: performance.getEntriesByType('resource')
            .filter(entry => /\.(wasm|pck(?:\.gz)?|js)(\?|$)/.test(entry.name))
            .map(entry => ({file: entry.name.split('/').pop(), ms: entry.duration,
                bytes: entry.encodedBodySize, transfer: entry.transferSize})),
    };
    console.log('LOAD_TIMING ' + JSON.stringify(report));
    let output = document.getElementById('load-timing');
    if (!output) {
        output = document.createElement('pre');
        output.id = 'load-timing'; output.hidden = true;
        document.body.append(output);
    }
    output.textContent = JSON.stringify(report);
};

async function pwEnableCache() {
    if (!('serviceWorker' in navigator)) return;
    try {
        await Promise.race([
            navigator.serviceWorker.register('game-cache.js').then(async () => {
                await navigator.serviceWorker.ready;
                if (!navigator.serviceWorker.controller) await new Promise(resolve => {
                    navigator.serviceWorker.addEventListener('controllerchange', resolve, {once: true});
                    setTimeout(resolve, 1200);
                });
            }),
            new Promise(resolve => setTimeout(resolve, 1800)),
        ]);
    } catch (_) { /* Storage and service workers are optional, including private browsing. */ }
}

async function pwCheckPack(buffer, pack) {
    const bytes = new Uint8Array(buffer);
    if (bytes.length !== pack.bytes || String.fromCharCode(...bytes.subarray(0, 4)) !== 'GDPC') {
        throw new Error('The downloaded game file is incomplete. Please reload to try again.');
    }
    if (window.crypto && window.crypto.subtle) {
        const digest = await window.crypto.subtle.digest('SHA-256', buffer);
        const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
        if (hash !== pack.sha256) throw new Error('The downloaded game file did not match this build. Please reload.');
    }
    return buffer;
}

function pwLoadingMessage(text) {
    const status = document.getElementById('status');
    if (!status) return;
    let message = document.getElementById('pw-loading-message');
    if (!message) {
        message = document.createElement('div');
        message.id = 'pw-loading-message';
        message.setAttribute('role', 'status');
        Object.assign(message.style, {position: 'absolute', bottom: '14%', padding: '6px 12px',
            color: '#233e53', background: '#8ecae6ee', borderRadius: '8px',
            font: '600 16px sans-serif', textAlign: 'center'});
        status.append(message);
    }
    message.hidden = !text;
    if (message.textContent !== text) message.textContent = text;
}

async function pwReadPack(response, pack, compressed, onProgress) {
    // Count bytes as they arrive, before optional decompression. Content-Length
    // describes the encoded body; Fetch has already decoded Content-Encoding.
    const encoded = response.headers.get('Content-Encoding') || '';
    const total = encoded ? 0 : Number(response.headers.get('Content-Length')) || 0;
    let current = 0;
    onProgress(0, total);
    const source = response.body.getReader();
    let stream = new ReadableStream({
        async pull(controller) {
            try {
                const next = await source.read();
                if (next.done) {
                    source.releaseLock();
                    controller.close();
                } else {
                    current += next.value.byteLength;
                    onProgress(current, total);
                    controller.enqueue(next.value);
                }
            } catch (error) { controller.error(error); }
        },
        cancel(reason) { return source.cancel(reason); },
    });
    // Fetch already decodes Content-Encoding if another static host adds it.
    if (compressed && !/gzip/i.test(encoded)) stream = stream.pipeThrough(new DecompressionStream('gzip'));
    const reader = stream.getReader();
    // Allocate exactly once: accumulating chunks and then joining them would
    // temporarily double the large pack's memory use on phones.
    const bytes = new Uint8Array(pack.bytes);
    let offset = 0;
    try {
        while (true) {
            const next = await reader.read();
            if (next.done) break;
            if (offset + next.value.byteLength > bytes.length) {
                await reader.cancel('Game file exceeds its expected size');
                throw new Error('The downloaded game file is larger than expected. Please reload.');
            }
            bytes.set(next.value, offset);
            offset += next.value.byteLength;
        }
    } finally { reader.releaseLock(); }
    if (offset !== pack.bytes) throw new Error('The downloaded game file is incomplete. Please reload to try again.');
    return bytes.buffer;
}

async function pwFetchPack(pack, onProgress = () => {}, onPreparing = () => {}) {
    if (typeof DecompressionStream === 'function') {
        try {
            const response = await fetch(pack.gzip);
            if (!response.ok) throw new Error('Compressed game download returned HTTP ' + response.status);
            const buffer = await pwReadPack(response, pack, true, onProgress);
            onPreparing();
            return await pwCheckPack(buffer, pack);
        } catch (error) {
            console.warn('Compressed game unavailable; loading the compatible game file.', error.message);
        }
    }
    const response = await fetch(pack.file);
    if (!response.ok) throw new Error('Game download returned HTTP ' + response.status + '. Please reload to try again.');
    const buffer = await pwReadPack(response, pack, false, onProgress);
    onPreparing();
    return pwCheckPack(buffer, pack);
}

window.pwStartGame = async function (engine, config, pack, options) {
    // A mobile browser may discard its GPU context after backgrounding the tab.
    // Offer a recovery at the same showcase exhibit instead of leaving a black canvas.
    const canvas = document.querySelector('canvas');
    if (canvas) canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        if (document.getElementById('pw-graphics-recovery')) return;
        const panel = document.createElement('div');
        panel.id = 'pw-graphics-recovery';
        Object.assign(panel.style, {position:'fixed', inset:'0', zIndex:'9999', background:'#243f50',
            color:'#fff4d6', display:'grid', placeContent:'center', gap:'18px', padding:'24px', textAlign:'center', font:'18px sans-serif'});
        const message = document.createElement('p'); message.textContent = 'The display was interrupted. Your saved progress is safe.';
        const button = document.createElement('button'); button.textContent = 'Resume game';
        Object.assign(button.style, {padding:'18px', font:'bold 20px sans-serif'});
        button.onclick = () => {
            const url = new URL(location.href);
            if (window.pwShowcaseIndex !== undefined) {url.searchParams.set('showcase','all'); url.searchParams.set('exhibit',window.pwShowcaseIndex+1);}
            location.replace(url.href);
        };
        panel.append(message,button); document.body.append(panel);
    });
    pwLoadingMessage('Loading game…');
    await pwEnableCache();
    pwMark('download-start');
    const reportProgress = (current, total) => {
        if (options.onProgress) options.onProgress(current, total);
        const amount = (current / 1000000).toFixed(1);
        const size = total > 0 ? ' of ' + (total / 1000000).toFixed(1) + ' MB' : ' MB';
        pwLoadingMessage('Downloading game… ' + amount + size);
    };
    try {
        await Promise.all([
            engine.init(config.executable),
            pwFetchPack(pack, reportProgress, () => {
                pwLoadingMessage('Preparing game…');
                if (options.onProgress) options.onProgress(0, 0);
            }).then(buffer => engine.preloadFile(buffer, pack.file)),
        ]);
        pwMark('pack-ready');
        pwLoadingMessage('Starting game…');
        // Let the stage paint before the engine starts its synchronous work.
        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
        // startGame would download the pack again. start consumes our preloaded bytes.
        return await engine.start({...options, args: ['--main-pack', pack.file].concat(options.args || config.args || [])});
    } catch (error) {
        pwLoadingMessage('');
        throw error;
    }
};

const GODOT_THREADS_ENABLED = false;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);

			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';

					statusProgress.removeAttribute('max');
