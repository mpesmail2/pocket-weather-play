// Portable startup: GitHub Pages serves .pck.gz as a file, without custom headers.
window.pwCache = [];
window.pwMarks = {};
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', event => {
        if (event.data.type === 'pw-cache') window.pwCache.push(event.data);
    });
}
window.pwMark = function (name) {
    window.pwMarks[name] = performance.now();
    const report = {
        marks: window.pwMarks, cache: window.pwCache,
        resources: performance.getEntriesByType('resource')
            .filter(entry => /\.(wasm|pck(?:\.gz)?|js)(\?|$)/.test(entry.name))
            .map(entry => ({file: entry.name.split('/').pop(), ms: entry.duration,
                bytes: entry.encodedBodySize, transfer: entry.transferSize})),
    };
    console.log('LOAD_TIMING ' + JSON.stringify(report));
    let output = document.getElementById('load-timing');
    if (!output) {
        output = document.createElement('pre');
        output.id = 'load-timing'; output.hidden = true;
        document.body.append(output);
    }
    output.textContent = JSON.stringify(report);
};

async function pwEnableCache() {
    if (!('serviceWorker' in navigator)) return;
    try {
        await Promise.race([
            navigator.serviceWorker.register('game-cache.js').then(async () => {
                await navigator.serviceWorker.ready;
                if (!navigator.serviceWorker.controller) await new Promise(resolve => {
                    navigator.serviceWorker.addEventListener('controllerchange', resolve, {once: true});
                    setTimeout(resolve, 1200);
                });
            }),
            new Promise(resolve => setTimeout(resolve, 1800)),
        ]);
    } catch (_) { /* Storage and service workers are optional, including private browsing. */ }
}

async function pwCheckPack(buffer, pack) {
    const bytes = new Uint8Array(buffer);
    if (bytes.length !== pack.bytes || String.fromCharCode(...bytes.subarray(0, 4)) !== 'GDPC') {
        throw new Error('The downloaded game file is incomplete. Please reload to try again.');
    }
    if (window.crypto && window.crypto.subtle) {
        const digest = await window.crypto.subtle.digest('SHA-256', buffer);
        const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
        if (hash !== pack.sha256) throw new Error('The downloaded game file did not match this build. Please reload.');
    }
    return buffer;
}

async function pwFetchPack(pack) {
    if (typeof DecompressionStream === 'function') {
        try {
            const response = await fetch(pack.gzip);
            if (!response.ok) throw new Error('Compressed game download returned HTTP ' + response.status);
            // Fetch already decodes Content-Encoding if a different static host adds it.
            const stream = /gzip/i.test(response.headers.get('Content-Encoding') || '')
                ? response.body : response.body.pipeThrough(new DecompressionStream('gzip'));
            return await pwCheckPack(await new Response(stream).arrayBuffer(), pack);
        } catch (error) {
            console.warn('Compressed game unavailable; loading the compatible game file.', error.message);
        }
    }
    const response = await fetch(pack.file);
    if (!response.ok) throw new Error('Game download returned HTTP ' + response.status + '. Please reload to try again.');
    return pwCheckPack(await response.arrayBuffer(), pack);
}

window.pwStartGame = async function (engine, config, pack, options) {
    await pwEnableCache();
    pwMark('download-start');
    if (options.onProgress) options.onProgress(0, pack.bytes);
    await Promise.all([
        engine.init(config.executable),
        pwFetchPack(pack).then(async buffer => {
            await engine.preloadFile(buffer, pack.file);
            if (options.onProgress) options.onProgress(pack.bytes, pack.bytes);
        }),
    ]);
    pwMark('pack-ready');
    // startGame would download the pack again. start consumes our preloaded bytes.
    return engine.start({...options, args: ['--main-pack', pack.file].concat(options.args || config.args || [])});
};

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"engine-3af966e6b934","experimentalVK":false,"fileSizes":{"game-850a923def69564df836dfa59b946307c8f444d4df3a0d8c2dcd6c7aca1cf215.pck":20183280,"engine-3af966e6b934.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"game-850a923def69564df836dfa59b946307c8f444d4df3a0d8c2dcd6c7aca1cf215.pck"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		pwStartGame(engine, GODOT_CONFIG, PW_PACK_CONFIG, {
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden'); pwMark('engine-started');
		}, displayFailureNotice);
	}
}());
